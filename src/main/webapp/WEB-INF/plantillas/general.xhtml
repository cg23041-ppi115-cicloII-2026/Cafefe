<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <!-- Idioma global de la sesión (misma receta que index.xhtml) -->
    <f:view locale="#{sesionUsuario.locale}">

    <h:head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <title><ui:insert name="titulo">Cafefe</ui:insert></title>
        <!-- Fuente Bricolage Grotesque (Google Fonts) -->
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;display=swap"/>
        <h:outputStylesheet name="css/default.css"/>
        <h:outputStylesheet name="css/cssLayout.css"/>
    </h:head>

    <h:body>

        <!-- Encabezado: logo + titulo de la pagina -->
        <div id="top">
            <h:graphicImage library="imagenes" name="logo15.png"
                            alt="Cafefe" styleClass="logo" />
            <div class="titulo">
                <h1><ui:insert name="titulo">NO PUSISTE LEYENDA</ui:insert></h1>
            </div>

            <!-- Selector de idioma global de la sesión (a un lado: arriba a la derecha) -->
            <h:form id="frmIdioma">
                <h:selectOneMenu id="cbxIdioma"
                                 value="#{sesionUsuario.localidad}"
                                 onchange="submit()"
                                 valueChangeListener="#{sesionUsuario.localidadChanged}">
                    <f:selectItems value="#{sesionUsuario.listaIdiomas}" />
                </h:selectOneMenu>
            </h:form>
        </div>

        <!-- Cuerpo: menu lateral izquierdo -->
        <div id="main">

            <!-- Menu lateral: un solo cajon con los enlaces -->
            <div id="sidebar">
                <div class="sidebar-titulo">Navegación</div>
                <ui:insert name="menuLateral">

                    <div class="sidebar-grupo">
                        <div class="sidebar-grupo-titulo">Menú</div>
                        <a href="#{request.contextPath}/paginas/Producto.jsf">Producto</a>
                        <a href="#{request.contextPath}/paginas/TipoProducto.jsf">Tipos de Producto</a>
                        <a href="#{request.contextPath}/paginas/ProductoCaracteristica.jsf">Caracteristica</a>
                        <a href="#{request.contextPath}/paginas/TipoDescuento.jsf">Descuentos</a>
                        <a href="#{request.contextPath}/paginas/Roles.jsf">Roles</a>
                        <a href="#{request.contextPath}/paginas/Empleado.jsf">Empleado</a>
                        <a href="#{request.contextPath}/paginas/Orden.jsf">Ordenes</a>
                    </div>

                </ui:insert>
            </div>

            <!-- Columna derecha: solo el contenido -->
            <div id="columna">

                <!-- Contenido principal de cada pagina -->
                <div id="content">
                    <ui:insert name="contenido">Content</ui:insert>
                </div>
            </div>
        </div>

        <!-- Pie de pagina -->
        <div id="bottom">
            todos los derechos reservados 2026 - Cafefe
            <ui:insert name="extras"/>
        </div>

    </h:body>

    </f:view>

</html>
