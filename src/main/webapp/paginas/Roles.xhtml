<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:comp="http://xmlns.jcp.org/jsf/composite/components"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">Gestión de Roles</ui:define>
    <ui:define name="contenido">
        <h:form id="pagina">

            <p:messages id="msgsRoles" showDetail="false" styleClass="top-messages" />

            <!-- SOLO la tabla; el formulario aparece al pulsar Nuevo/Editar -->
            <div class="card">
                <div style="margin-bottom: 10px;">
                    <p:commandButton value="#{msg['crud.nuevoBoton']}" action="#{rolModel.btnNuevoHandler}"
                                     update="msgsRoles pnlFormRoles" styleClass="btn btn-primary"
                                     oncomplete="var e=document.querySelector('[id$=pnlFormRoles]'); if(e){e.scrollIntoView({behavior:'smooth', block:'start'});}" />
                </div>
                <h3>Roles</h3>
                <p:dataTable id="tblRoles" value="#{rolModel.lazyModel}" var="item" styleClass="tabla"
                             lazy="true"
                             selectionMode="single" selection="#{rolModel.seleccion}"
                             rowKey="#{item.idRol}"
                             paginator="true" rows="5"
                             emptyMessage="No hay registros">
                    <p:ajax event="rowSelect" update="botoneraRoles" />
                    <p:ajax event="rowUnselect" update="botoneraRoles" />
                    <p:column headerText="Nombre">
                        #{item.nombre}
                    </p:column>
                    <p:column headerText="Estado">
                        #{item.activo ? 'ACTIVO' : 'INACTIVO'}
                    </p:column>
                    <p:column headerText="Observaciones">
                        #{item.observaciones}
                    </p:column>
                </p:dataTable>

                <!-- Botones: componente compuesto botonesTabla.xhtml -->
                <h:panelGroup id="botoneraRoles" layout="block" style="margin-top: 12px;">
                    <comp:botonesTabla model="#{rolModel}"
                                       editUpdate="msgsRoles pnlFormRoles"
                                       deleteUpdate="msgsRoles tblRoles botoneraRoles pnlFormRoles" />
                    <h:outputText value="#{msg['crud.seleccionarFila']}"
                                  rendered="#{empty rolModel.seleccion}"
                                  style="color:#777; font-style: italic;" />
                </h:panelGroup>
            </div>

            <!-- Formulario en panel: oculto hasta Nuevo/Editar -->
            <h:panelGroup id="pnlFormRoles" layout="block">
                <h:panelGroup layout="block" rendered="#{rolModel.formVisible}">
                    <div class="card">
                        <h2>Rol</h2>

                        <h:panelGrid columns="3" cellpadding="5">
                            <h:outputLabel for="idRol" value="ID:" />
                            <p:inputText id="idRol" value="#{rolModel.registro.idRol}" required="false" disabled="true" size="36" />
                            <h:panelGroup />

                            <h:outputLabel for="nombreRol" value="Nombre:" />
                            <p:inputText id="nombreRol" value="#{rolModel.registro.nombre}" />
                            <h:panelGroup />

                            <h:outputLabel for="observacionesRol" value="Observaciones:" />
                            <p:inputTextarea id="observacionesRol"
                                             value="#{rolModel.registro.observaciones}"
                                             rows="3" cols="50" />
                            <h:panelGroup />

                            <h:outputLabel for="activoRol" value="Estado:" />
                            <p:selectBooleanCheckbox id="activoRol"
                                                     value="#{rolModel.registro.activo}"
                                                     itemLabel="Activo" />
                            <h:panelGroup />
                        </h:panelGrid>

                        <div style="margin-top: 10px;">
                            <p:commandButton value="#{msg['crud.guardar']}" action="#{rolModel.btnGuardarHandler}"
                                             update="msgsRoles pnlFormRoles tblRoles botoneraRoles"
                                             styleClass="btn btn-primary" />
                            &#160;
                            <p:commandButton value="#{msg['crud.cancelar']}" action="#{rolModel.btnCancelarHandler}"
                                             update="msgsRoles pnlFormRoles tblRoles botoneraRoles"
                                             styleClass="btn" />
                        </div>
                    </div>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </ui:define>

</ui:composition>
