<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:comp="http://xmlns.jcp.org/jsf/composite/components"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">Órdenes</ui:define>

    <ui:define name="contenido">
        <h:form id="frmPagina">
            <!-- Botones de pagina: trabajan sobre la cabecera de Tomar Orden -->
            <div style="margin-bottom: 10px;">
                <p:commandButton id="btnNuevaOrden" value="#{msg['pagina.orden.nuevaOrden']}"
                                 action="#{ordenModel.btnNuevaOrdenHandler}"
                                 update="tabs:msgsTomar tabs:pnlCabecera"
                                 styleClass="btn btn-primary" />
                &#160;
                <p:commandButton id="btnCancelarOrden" value="#{msg['pagina.orden.cancelarOrden']}"
                                 action="#{ordenModel.btnCancelarOrdenHandler}"
                                 update="tabs:msgsTomar tabs:pnlCabecera"
                                 styleClass="btn" />
            </div>

            <p:tabView id="tabs">

                <!-- ================= PESTAÑA 1: TOMAR ORDEN ================= -->
                <p:tab id="tabTomar" title="Tomar Orden">

                    <p:messages id="msgsTomar" showDetail="false" styleClass="top-messages" />

                    <!-- Cabecera de la orden: tabla 'orden' -->
                    <div class="card">
                        <h3>Tomar Orden</h3>
                        <h:panelGroup id="pnlCabecera" layout="block">
                            <h:panelGrid columns="3" cellpadding="5">
                                <h:outputLabel for="id" value="ID:" />
                                <p:inputText id="id" value="#{ordenModel.registro.idOrden}"
                                             required="false" disabled="true" size="36" />
                                <h:panelGroup />

                                <h:outputLabel for="cboCobrador" value="Empleado:" />
                                <p:selectOneMenu id="cboCobrador"
                                                 value="#{ordenModel.cobradorSeleccionado}"
                                                 disabled="#{ordenModel.ordenGuardada}">
                                    <f:selectItem itemLabel="-- Elija quién realiza la orden --" itemValue="#{null}" />
                                    <f:selectItems value="#{ordenModel.listaCobradores}" />
                                </p:selectOneMenu>
                                <h:panelGroup />

                                <h:outputLabel for="fecha" value="Fecha de orden:" />
                                <p:inputText id="fecha" value="#{ordenModel.registro.fechaCreacion}"
                                             required="false" disabled="true" size="36">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
                                </p:inputText>
                                <h:panelGroup />
                            </h:panelGrid>

                            <div style="margin-top: 10px;">
                                <p:commandButton value="#{msg['crud.guardar']}"
                                                 action="#{ordenModel.btnGuardarHandler}"
                                                 update="msgsTomar pnlCabecera"
                                                 disabled="#{ordenModel.ordenGuardada}"
                                                 styleClass="btn btn-primary" />
                            </div>
                        </h:panelGroup>
                    </div>
                </p:tab>
                 <!-- ================= PESTAÑA 2: DETALLE DE ORDEN ================= -->
                <p:tab id="tabDetalleOrden" title="Detalle de Orden">

                    <p:messages id="msgsDetalle" showDetail="false" styleClass="top-messages" />

                    <!-- Tabla con las lineas de la tabla 'orden_producto' -->
                    <div class="card">
                        <div style="margin-bottom: 10px;">
                            <p:commandButton id="btnAplicarDescuento" value="#{msg['pagina.orden.aplicarDescuento']}"
                                             action="#{ordenProductoModel.btnAbrirDescuentos(ordenModel.registro.idOrden)}"
                                             update="msgsDetalle dlgAplicarDesc"
                                             oncomplete="if (args.listos) PF('dlgAplicarDesc').show();"
                                             styleClass="btn btn-primary" />
                        </div>

                        <p:dataTable id="detalleTabla" value="#{ordenProductoModel.lazyModel}" var="item"
                                     styleClass="tabla"
                                     lazy="true"
                                     paginator="true" paginatorPosition="both" rows="5"
                                     emptyMessage="No hay registros">
                            <p:column headerText="ID" style="font-size: 0.8em;">
                                #{item.idOrdenProducto}
                            </p:column>
                            <p:column headerText="Producto">
                                #{item.idProducto.nombre}
                            </p:column>
                            <p:column headerText="Precio">
                                #{item.precio}
                            </p:column>
                            <p:column headerText="Observaciones">
                                #{item.observaciones}
                            </p:column>
                        </p:dataTable>

                        <div style="margin-top: 10px;">
                            <h:panelGroup id="btnsLinea" layout="block">
                                <p:commandButton id="btnNuevaLinea" value="#{msg['crud.nuevoBoton']}"
                                                 action="#{ordenProductoModel.btnNuevoHandler}"
                                                 update="msgsDetalle pnlFormDetalle btnsLinea"
                                                 styleClass="btn btn-primary"
                                                 oncomplete="var e=document.querySelector('[id$=pnlFormDetalle]'); if(e){e.scrollIntoView({behavior:'smooth', block:'start'});}" />
                                &#160;
                                <p:commandButton id="btnCancelarLinea" value="#{msg['crud.cancelar']}"
                                                 action="#{ordenProductoModel.btnCancelarHandler}"
                                                 update="msgsDetalle pnlFormDetalle btnsLinea"
                                                 styleClass="btn"
                                                 rendered="#{ordenProductoModel.formVisible}" />
                            </h:panelGroup>
                        </div>
                    </div>

                    <!-- Formulario de la linea: aparece al pulsar Nuevo -->
                    <h:panelGroup id="pnlFormDetalle" layout="block">
                        <h:panelGroup layout="block" rendered="#{ordenProductoModel.formVisible}">
                            <div class="card">
                                <h:panelGrid columns="3" cellpadding="5">
                                    <h:outputLabel for="idLinea" value="ID:" />
                                    <p:inputText id="idLinea" value="#{ordenProductoModel.registro.idOrdenProducto}"
                                                 required="false" disabled="true" size="36" />
                                    <h:panelGroup />

                                    <h:outputLabel for="txtProductoLinea" value="Producto:" />
                                    <h:panelGroup id="pnlSelProducto" layout="block">
                                        <p:inputText id="txtProductoLinea" value="#{ordenProductoModel.productoElegido}"
                                                     disabled="true" size="36" />
                                        <p:commandButton id="btnSelProducto" value="#{msg['pagina.orden.seleccionarProducto']}"
                                                         type="button" styleClass="btn btn-primary"
                                                         style="margin-left: 8px;"
                                                         onclick="PF('dlgSelProducto').show()" />
                                    </h:panelGroup>
                                    <h:panelGroup />

                                    <h:outputLabel for="precioLinea" value="Precio:" />
                                    <p:inputText id="precioLinea" value="#{ordenProductoModel.registro.precio}"
                                                 size="36" />
                                    <h:panelGroup />

                                    <h:outputLabel for="obsLinea" value="Observaciones:" />
                                    <p:inputTextarea id="obsLinea"
                                                     value="#{ordenProductoModel.registro.observaciones}"
                                                     rows="3" cols="50" />
                                    <h:panelGroup />
                                </h:panelGrid>

                                <div style="margin-top: 10px;">
                                    <p:commandButton id="btnGuardarLinea" value="#{msg['crud.guardar']}"
                                                     action="#{ordenProductoModel.btnGuardarLinea(ordenModel.registro.idOrden)}"
                                                     update="msgsDetalle pnlFormDetalle btnsLinea detalleTabla"
                                                     styleClass="btn btn-primary" />
                                </div>
                            </div>

                            <!-- Ventana emergente: seleccionar el producto de la linea -->
                            <p:dialog id="dlgSelProducto" header="Seleccionar Producto"
                                      widgetVar="dlgSelProducto" modal="true" closable="true"
                                      resizable="false" width="460">
                                <h:panelGrid columns="2" cellpadding="5">
                                    <h:outputLabel for="acProducto" value="Producto:" />
                                    <p:autoComplete id="acProducto"
                                                    value="#{ordenProductoModel.productoBusqueda}"
                                                    completeMethod="#{ordenProductoModel.completarProductos}"
                                                    minQueryLength="0" forceSelection="true" size="36" />
                                </h:panelGrid>
                                <f:facet name="footer">
                                    <p:commandButton id="btnConfProducto" value="#{msg['pagina.orden.seleccionar']}"
                                                     styleClass="btn btn-primary"
                                                     action="#{ordenProductoModel.btnSeleccionarProductoHandler}"
                                                     update="msgsDetalle pnlFormDetalle"
                                                     oncomplete="PF('dlgSelProducto').hide()" />
                                </f:facet>
                            </p:dialog>
                        </h:panelGroup>
                    </h:panelGroup>

                    <!-- Ventana emergente: descuentos aplicables a los productos de la orden -->
                    <p:dialog id="dlgAplicarDesc" widgetVar="dlgAplicarDesc" modal="true"
                              closable="true" resizable="false" width="430">
                        <h:panelGrid columns="2" cellpadding="5">
                            <h:outputLabel for="cboDescAplicable" value="Descuento aplicable:" />
                            <p:selectOneMenu id="cboDescAplicable"
                                             value="#{ordenProductoModel.descuentoAplicableSeleccionado}">
                                <f:selectItem itemLabel="Seleccione un descuento" itemValue="#{null}" />
                                <f:selectItems value="#{ordenProductoModel.listaDescuentosAplicables}" />
                            </p:selectOneMenu>
                        </h:panelGrid>
                        <f:facet name="footer">
                            <p:commandButton id="btnAplicarDesc" value="#{msg['pagina.orden.aplicar']}"
                                             styleClass="btn btn-primary"
                                             action="#{ordenProductoModel.btnAplicarDescuentoHandler}"
                                             update="msgsDetalle detalleTabla"
                                             oncomplete="PF('dlgAplicarDesc').hide()" />
                        </f:facet>
                    </p:dialog>
                </p:tab>
            </p:tabView>
        </h:form>
    </ui:define>

</ui:composition>
