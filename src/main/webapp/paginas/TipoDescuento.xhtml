<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Gestión de Tipos de Descuento</title>
    </h:head>
    <h:body>
        <h2>Administración de Tipos de Descuento</h2>

        <!-- Formulario de Entrada / Edición -->
        <h:form id="frmTipoDescuento">
            <h:inputHidden value="#{tipoDescuentoModel.registro.idTipoDescuento}" />

            <h:panelGrid columns="3" cellpadding="5">
                <h:outputLabel for="nombre" value="Nombre del Descuento:" />
                <h:inputText id="nombre" value="#{tipoDescuentoModel.registro.nombre}" required="true" />
                <h:message for="nombre" style="color:red" />

                <h:panelGroup>
                    <h:commandButton value="Guardar" action="#{tipoDescuentoModel.guardar}" />
                    <h:commandButton value="Nuevo / Limpiar" action="#{tipoDescuentoModel.limpiar}" immediate="true" />
                </h:panelGroup>
            </h:panelGrid>
        </h:form>

        <hr/>

        <!-- Tabla de Datos con Acciones CRUD -->
        <h3>Lista de Tipos de Descuento</h3>
        <h:form id="frmTablaDescuento">
            <h:dataTable value="#{tipoDescuentoModel.lista}" var="item" border="1" cellpadding="5">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    #{item.idTipoDescuento}
                </h:column>

                <h:column>
                    <f:facet name="header">Nombre</f:facet>
                    #{item.nombre}
                </h:column>

                <h:column>
                    <f:facet name="header">Acciones</f:facet>
                    <h:commandButton value="Editar" action="#{tipoDescuentoModel.seleccionar(item)}" />
                    &#160;
                    <h:commandButton value="Eliminar" action="#{tipoDescuentoModel.eliminar(item)}" 
                                     onclick="return confirm('¿Está seguro de eliminar este registro?');" />
                </h:column>
            </h:dataTable>
        </h:form>
    </h:body>
</html>
