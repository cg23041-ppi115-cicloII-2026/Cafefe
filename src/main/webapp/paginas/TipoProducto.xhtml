<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:comp="http://xmlns.jcp.org/jsf/composite/components"
                template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">Gestión de Tipos de Producto</ui:define>

    <ui:define name="contenido">
        <!-- La asignación producto↔tipo vive en Producto.xhtml (pestaña
             "Tipos de Producto"): aquí SOLO se crea el tipo -->
        <h:form id="pagina">

            <p:messages id="msgsTp" showDetail="false" styleClass="top-messages" />

            <!-- SOLO la tabla; el formulario aparece al pulsar Nuevo/Editar -->
            <div class="card">
                <div style="margin-bottom: 10px;">
                    <p:commandButton value="#{msg['crud.nuevoBoton']}" action="#{tipoProductoModel.btnNuevoHandler}"
                                     update="msgsTp pnlFormTp" styleClass="btn btn-primary"
                                     oncomplete="var e=document.querySelector('[id$=pnlFormTp]'); if(e){e.scrollIntoView({behavior:'smooth', block:'start'});}" />
                </div>
                <h3>Lista de Tipos de Producto</h3>
                <p:dataTable id="tblTp" value="#{tipoProductoModel.lazyModel}" var="item" styleClass="tabla"
                             lazy="true"
                             selectionMode="single" selection="#{tipoProductoModel.seleccion}"
                             rowKey="#{item.idTipoProducto}"
                             paginator="true" rows="5"
                             emptyMessage="No hay registros">
                    <p:ajax event="rowSelect" update="botoneraTp" />
                    <p:ajax event="rowUnselect" update="botoneraTp" />
                    <p:column headerText="ID" style="font-size: 0.8em;">
                        #{item.idTipoProducto}
                    </p:column>
                    <p:column headerText="Nombre">
                        #{item.nombre}
                    </p:column>
                    <p:column headerText="Estado">
                        #{item.activo ? 'ACTIVO' : 'INACTIVO'}
                    </p:column>
                    <p:column headerText="Observaciones">
                        #{item.observaciones}
                    </p:column>
                </p:dataTable>

                <!-- Botones: componente compuesto botonesTabla.xhtml -->
                <h:panelGroup id="botoneraTp" layout="block" style="margin-top: 12px;">
                    <comp:botonesTabla model="#{tipoProductoModel}"
                                       editUpdate="msgsTp pnlFormTp"
                                       deleteUpdate="msgsTp tblTp botoneraTp pnlFormTp" />
                    <h:outputText value="#{msg['crud.seleccionarFila']}"
                                  rendered="#{empty tipoProductoModel.seleccion}"
                                  style="color:#777; font-style: italic;" />
                </h:panelGroup>
            </div>

            <!-- Formulario en panel: oculto hasta Nuevo/Editar -->
            <h:panelGroup id="pnlFormTp" layout="block">
                <h:panelGroup layout="block" rendered="#{tipoProductoModel.formVisible}">
                    <div class="card">
                        <h2>Administración de Tipos de Producto</h2>

                        <h:panelGrid columns="3" cellpadding="5">
                            <h:outputLabel for="idTp" value="ID:" />
                            <p:inputText id="idTp" value="#{tipoProductoModel.registro.idTipoProducto}" required="false" disabled="true" size="36" />
                            <h:panelGroup />

                            <h:outputLabel for="nombre" value="Nombre del Tipo:" />
                            <p:inputText id="nombre" value="#{tipoProductoModel.registro.nombre}" />
                            <h:panelGroup />

                            <h:outputLabel for="observaciones" value="Observaciones:" />
                            <p:inputTextarea id="observaciones" value="#{tipoProductoModel.registro.observaciones}"
                                             rows="3" cols="50" />
                            <h:panelGroup />

                            <h:outputLabel for="activo" value="Estado:" />
                            <p:selectBooleanCheckbox id="activo" value="#{tipoProductoModel.registro.activo}"
                                                     itemLabel="Activo" />
                            <h:panelGroup />
                        </h:panelGrid>

                        <div style="margin-top: 10px;">
                            <p:commandButton value="#{msg['crud.guardar']}" action="#{tipoProductoModel.btnGuardarHandler}"
                                             update="msgsTp pnlFormTp tblTp botoneraTp" styleClass="btn btn-primary" />
                            &#160;
                            <p:commandButton value="#{msg['crud.cancelar']}" action="#{tipoProductoModel.btnCancelarHandler}"
                                             update="msgsTp pnlFormTp tblTp botoneraTp" styleClass="btn" />
                        </div>
                    </div>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </ui:define>

</ui:composition>
